# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Scale to zero when idle to keep costs minimal for launch.
  minInstances: 0
  maxInstances: 2

# The Firebase web config is already baked into src/lib/firebase.ts as
# non-secret fallbacks, so no env vars are required here. To override per
# backend, add entries like:
#
# env:
#   - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
#     value: mqcart-prod
#     availability: [BUILD, RUNTIME]
